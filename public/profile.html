<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Mell Footage</title>
    <style>
        :root {
            --primary: #7ec384;
            --primary-dark: #5fa368;
            --bg: #e8f5e9;
            --bg2: #f5f9f3;
            --surface: rgba(255, 255, 255, .88);
            --surface-strong: #fff;
            --text: #1e1e1e;
            --muted: #778077;
            --border: #c1d4b8;
            --shadow: 0 10px 35px rgba(51, 84, 55, .12);
            --verified: #2196f3;
            --tag-bg: rgba(126, 195, 132, .16);
            --tag-text: #4d8653;
            --radius: 18px;
            --small-radius: 12px;
        }

        body.dark-theme {
            --bg: #0a0e27;
            --bg2: #15182a;
            --surface: rgba(31, 34, 45, .9);
            --surface-strong: #24262f;
            --text: #f2f4f2;
            --muted: #a5ada6;
            --border: #3f4741;
            --shadow: 0 12px 35px rgba(0, 0, 0, .34);
            --tag-bg: rgba(126, 195, 132, .14);
            --tag-text: #a9ddb0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            min-height: 100%;
            width: 100%
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 0%, rgba(126, 195, 132, .22), transparent 34%),
                radial-gradient(circle at 100% 10%, rgba(95, 163, 104, .14), transparent 28%),
                linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
            transition: background .25s, color .25s;
        }

        body.dark-theme {
            background:
                radial-gradient(circle at 10% 0%, rgba(126, 195, 132, .10), transparent 34%),
                radial-gradient(circle at 100% 10%, rgba(69, 90, 73, .12), transparent 28%),
                linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
        }

        button,
        a {
            font: inherit
        }

        a {
            color: inherit
        }

        .topnav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: color-mix(in srgb, var(--surface-strong) 84%, transparent);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 5px 18px rgba(0, 0, 0, .06);
        }

        .logo {
            font-family: Georgia, serif;
            font-style: italic;
            color: var(--primary);
            font-size: 1.35rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }

        .spacer {
            flex: 1
        }

        .nav-link,
        .theme-btn,
        #settings-btn {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            transition: .2s ease;
        }

        .nav-link {
            text-decoration: none;
            padding: 8px 13px;
            border-radius: 10px;
            font-size: .9rem;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .theme-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none
        }

        #settings-btn {
            padding: 8px 13px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .nav-link:hover,
        .theme-btn:hover,
        #settings-btn:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .page {
            width: min(1040px, calc(100% - 28px));
            margin: 0 auto;
            padding: 30px 0 60px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* ---------- PROFILE HERO ---------- */

        .not-logged {
            padding: 40px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .not-logged h2 {
            margin-bottom: 12px;
        }

        .not-logged p {
            color: var(--muted);
            margin-bottom: 10px;
        }

        .not-logged a {
            display: inline-block;
            margin-top: 16px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 700;
            transition: .2s;
        }

        .not-logged a:hover {
            background: var(--primary-dark);
        }

        .profile-card {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 26px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .profile-card::after {
            content: "";
            position: absolute;
            right: -70px;
            top: -80px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(126, 195, 132, .24), transparent 70%);
            pointer-events: none;
        }

        .avatar {
            width: 94px;
            height: 94px;
            flex: 0 0 94px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-size: 2.2rem;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(95, 163, 104, .32);
            border: 4px solid rgba(255, 255, 255, .75);
        }

        .profile-info {
            min-width: 0;
            flex: 1;
        }

        .profile-name-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 7px;
        }

        .profile-name-row h2 {
            font-size: 1.75rem;
            line-height: 1.15;
            font-weight: 800;
            word-break: break-word;
            margin-bottom: 0;
        }

        .verified-badge {
            width: 21px;
            height: 21px;
            flex: 0 0 21px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--verified);
            color: #fff;
            font-size: 13px;
            font-weight: 900;
            box-shadow: 0 2px 8px rgba(33, 150, 243, .32);
            line-height: 1;
        }

        .user-tags {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 2px 0 12px;
        }

        .user-tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 9px;
            border-radius: 999px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border: 1px solid color-mix(in srgb, var(--primary) 60%, transparent);
            font-size: .75rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(126, 195, 132, .13);
            border: 1px solid var(--border);
            color: var(--primary-dark);
            font-size: .76rem;
            font-weight: 750;
            margin-bottom: 14px;
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            background-color: #229ed9;
            color: white;
            border: 1px solid #229ed9;
            padding: 9px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: .88rem;
            font-weight: 700;
            margin-top: 4px;
            transition: .2s;
        }

        .telegram-btn:hover {
            background-color: #168dcc;
            transform: translateY(-1px);
        }

        #telegramCode {
            margin-top: 12px;
            color: var(--text);
            font-size: .92rem;
        }

        #telegramCode strong {
            display: inline-block;
            margin: 5px 0;
        }

        #telegramCode code {
            display: inline-block;
            padding: 7px 10px;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            margin: 4px 0;
        }

        .logout-btn {
            align-self: flex-start;
            background-color: #e53935;
            color: #fff;
            border: 1px solid #e53935;
            padding: 9px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: .9rem;
            font-weight: 700;
            transition: .2s;
        }

        .logout-btn:hover {
            background-color: #c62828;
            transform: translateY(-1px);
        }

        /* ---------- SECTIONS ---------- */

        .section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .section-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 15px;
        }

        .section-header h3 {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .section-header span {
            font-size: .82rem;
            color: var(--muted);
        }

        .section-header a {
            font-size: .85rem;
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 700;
        }

        .section-header a:hover {
            text-decoration: underline;
        }

        /* ---------- COLLECTIONS ---------- */

        .collection-list {
            display: grid;
            gap: 12px;
        }

        .collection-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .05);
            transition: transform .2s, box-shadow .2s, border-color .2s;
        }

        .collection-item:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 10px 24px rgba(126, 195, 132, .16);
        }

        .col-icon {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: rgba(126, 195, 132, .13);
            border: 1px solid var(--border);
            font-size: 1.35rem;
        }

        .col-info {
            flex: 1;
            min-width: 0;
        }

        .col-name {
            font-size: .98rem;
            font-weight: 750;
            word-break: break-word;
            margin-bottom: 3px;
        }

        .col-meta {
            color: var(--muted);
            font-size: .78rem;
        }

        .col-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .btn-sm {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 7px 11px;
            font-size: .8rem;
            font-weight: 650;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: .2s;
        }

        .btn-view {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn-view:hover {
            background: var(--primary-dark);
        }

        .btn-copy {
            background: var(--surface-strong);
            color: var(--text);
        }

        .btn-copy:hover {
            border-color: var(--primary);
        }

        .btn-delete {
            background: #e53935;
            color: #fff;
            border-color: #e53935;
        }

        .btn-delete:hover {
            background: #c62828;
        }

        .new-col-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .05);
        }

        .new-col-form h4 {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .new-col-form input,
        .new-col-form textarea {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            color: var(--text);
            font-size: .95rem;
            outline: none;
            width: 100%;
            transition: border-color .2s;
        }

        .new-col-form input:focus,
        .new-col-form textarea:focus {
            border-color: var(--primary);
        }

        .new-col-form input::placeholder,
        .new-col-form textarea::placeholder {
            color: var(--muted);
        }

        .new-col-form textarea {
            resize: vertical;
            min-height: 60px;
        }

        .new-col-form label {
            font-size: .9rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-create {
            align-self: flex-start;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: .95rem;
            transition: .2s;
        }

        .btn-create:hover {
            background: var(--primary-dark);
        }

        /* ---------- LIKED VIDEOS ---------- */

        .liked-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .liked-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .05);
            transition: transform .2s, box-shadow .2s;
        }

        .liked-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(126, 195, 132, .16);
        }

        .liked-thumb {
            width: 100%;
            aspect-ratio: 9/16;
            background-color: #000;
            overflow: hidden;
        }

        .liked-thumb video,
        .liked-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .liked-info {
            padding: 8px 10px;
            font-size: .78rem;
            color: var(--text);
            word-break: break-word;
        }

        .liked-info a {
            color: var(--primary-dark);
            text-decoration: none;
            font-size: .75rem;
            font-weight: 700;
        }

        .liked-info a:hover {
            text-decoration: underline;
        }

        .empty-msg {
            padding: 34px 20px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--muted);
            font-size: .95rem;
        }

        .empty-msg a {
            color: var(--primary-dark);
            font-weight: 700;
        }

        /* ---------- SUBMISSIONS ---------- */

        .sub-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sub-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .05);
        }

        .sub-name {
            flex: 1;
            font-weight: 750;
            word-break: break-word;
        }

        .sub-date {
            font-size: .8rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .badge {
            padding: 4px 11px;
            border-radius: 999px;
            font-size: .78rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .badge-pending {
            background: rgba(234, 179, 8, .16);
            color: #a16207;
        }

        .badge-approved {
            background: rgba(126, 195, 132, .18);
            color: var(--primary-dark);
        }

        .badge-rejected {
            background: rgba(229, 57, 53, .14);
            color: #c62828;
        }

        body.dark-theme .badge-pending {
            background: rgba(234, 179, 8, .16);
            color: #fde68a;
        }

        body.dark-theme .badge-approved {
            background: rgba(126, 195, 132, .16);
            color: #a9ddb0;
        }

        body.dark-theme .badge-rejected {
            background: rgba(229, 57, 53, .18);
            color: #f0b0b0;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 500;
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            background: #2e7d32;
            color: #fff;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .22);
        }

        .toast.show {
            display: block;
            animation: toastIn .22s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media (max-width: 700px) {
            .topnav {
                padding: 10px 12px
            }

            .logo {
                font-size: 1.15rem
            }

            #settings-btn {
                display: none
            }

            .page {
                width: min(100% - 18px, 1040px);
                padding-top: 18px
            }

            .profile-card {
                align-items: flex-start;
                flex-wrap: wrap;
                padding: 19px;
                gap: 15px;
            }

            .avatar {
                width: 72px;
                height: 72px;
                flex-basis: 72px;
                font-size: 1.7rem
            }

            .profile-name-row h2 {
                font-size: 1.35rem
            }

            .logout-btn {
                margin-left: auto;
            }

            .collection-item,
            .sub-item {
                align-items: flex-start;
                flex-wrap: wrap
            }

            .col-actions {
                width: 100%;
                padding-left: 60px
            }

            .sub-name {
                width: 100%;
                flex-basis: 100%;
            }
        }
    </style>
</head>

                collectionCreated: 'Колекцію створено!',
                collectionDeleted: 'Колекцію видалено',
                deleteCollectionConfirm: 'Видалити колекцію?',
                linkCopied: 'Посилання скопійовано!',

                error: 'Помилка',
                loginError: 'Потрібно увійти в акаунт',
                telegramError: 'Помилка Telegram'
            },

            en: {
                back: '← Back',

                loading: 'Loading...',
                loginRequiredTitle: 'You are not logged in',
                loginRequiredText: 'You need to log in to view your profile.',
                login: 'Login / Register',

                logout: 'Logout',

                linkTelegram: '🔗 Link Telegram',
                yourCode: 'Your code:',
                telegramBot: 'Send it to our Telegram bot:',
                codeExpires: '⏰ Code is valid for 10 minutes.',

                collections: '📁 Collections',
                createCollection: 'Create a new collection',
                collectionName: 'Collection name...',
                collectionDescription: 'Description (optional)...',
                publicCollection: 'Public (available by link)',
                privateCollection: 'Private',
                public: 'Public',
                create: 'Create',

                noCollections: 'No collections. Create the first one!',
                open: 'Open',
                copyLink: 'Copy link',
                delete: 'Delete',

                submissions: '📤 My submissions',
                sendFootage: '+ Submit footage',
                noSubmissions: 'You have not submitted anything yet.',

                pending: '⏳ Pending',
                approved: '✅ Approved',
                rejected: '❌ Rejected',

                likedVideos: '♥ Liked videos',
                noLikedVideos: 'You have not liked anything yet.',
                download: '⬇ Download',

                pieces: 'pcs.',

                collectionNameRequired: 'Enter a name!',
                collectionCreated: 'Collection created!',
                collectionDeleted: 'Collection deleted',
                deleteCollectionConfirm: 'Delete collection?',
                linkCopied: 'Link copied!',

                error: 'Error',
                loginError: 'Login required',
                telegramError: 'Telegram error'
            }
        };



        let currentLang = localStorage.getItem('app_lang') || 'en';

        if (!translations[currentLang]) {
            currentLang = 'en';
        }

        document.documentElement.lang = currentLang;

        // Keep the profile visually consistent with the user's saved site accent.
        (function applySavedAccent() {
            const accent = localStorage.getItem('accent_color');
            if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
                document.documentElement.style.setProperty('--primary', accent);
            }
        })();


        function t(key) {
            return (
                translations[currentLang]?.[key] ??
                translations.en?.[key] ??
                key
            );
        }


        function escapeHtml(s) {
            return String(s ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }



        if (localStorage.getItem('theme') === 'dark' || localStorage.getItem('darkTheme') === 'true') {
            document.body.classList.add('dark-theme');
        }


        function toggleTheme() {

            const isDark = document.body.classList.toggle('dark-theme');

            localStorage.setItem(
                'theme',
                isDark ? 'dark' : 'light'
            );
        }



        function showToast(msg, color = '#2e7d32') {

            const toast = document.getElementById('toast');

            toast.textContent = msg;
            toast.style.backgroundColor = color;

            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }


        async function loadProfile() {

            const page = document.getElementById('page-content');

            try {

                const meRes = await fetch('/api/me', {
                    credentials: 'same-origin'
                });

                const me = await meRes.json();

                if (!me.loggedIn) {

                    page.innerHTML = `
                        <div class="not-logged">

                            <h2>${t('loginRequiredTitle')}</h2>

                            <p>${t('loginRequiredText')}</p>

                            <a href="/auth">
                                ${t('login')}
                            </a>

                        </div>
                    `;

                    return;
                }


                const [profRes, subsRes] = await Promise.all([

                    fetch('/api/profile', {
                        credentials: 'same-origin'
                    }),

                    fetch('/api/submissions/my', {
                        credentials: 'same-origin'
                    })

                ]);


                if (!profRes.ok) {
                    throw new Error('Profile request failed');
                }


                const prof = await profRes.json();

                const subs = subsRes.ok
                    ? await subsRes.json()
                    : [];


                // =========================================================
                // FALLBACK: /api/profile may not include "tags", but the
                // public /api/user/{username} endpoint does (same shape
                // as user.html: [{ name, color, icon }, ...]). If tags
                // are missing here, fetch them from that endpoint.
                // =========================================================

                if (!Array.isArray(prof.tags) && prof.username) {

                    try {

                        const userRes = await fetch(
                            `/api/user/${encodeURIComponent(prof.username)}`,
                            { credentials: 'same-origin' }
                        );

                        if (userRes.ok) {

                            const userData = await userRes.json();

                            if (Array.isArray(userData.tags)) {
                                prof.tags = userData.tags;
                            }
                        }

                    } catch (tagsError) {
                        console.error('Fallback tags fetch error:', tagsError);
                    }
                }



                page.innerHTML = `

                   <div class="profile-card">

            <div class="avatar" id="prof-avatar"></div>

            <div class="profile-info">

                <div class="profile-name-row">

                    <h2 id="prof-username"></h2>

                    <span
                        id="prof-verified"
                        class="verified-badge"
                        title="Verified"
                        style="display:none;">
                        ✓
                    </span>

                </div>

                <div
                    id="prof-tags"
                    class="user-tags">
                </div>

                <span
                    class="role-badge"
                    id="prof-role">
                </span>

                <div>
                    <button
                        class="telegram-btn"
                        onclick="generateTelegramCode()">
                        ${t('linkTelegram')}
                    </button>
                </div>

                <div id="telegramCode"></div>

            </div>

            <button
                class="logout-btn"
                onclick="logout()">
                ${t('logout')}
            </button>

        </div>


                    <!-- COLLECTIONS -->

                    <div class="section">

                        <div class="section-header">

                            <h3>
                                ${t('collections')}
                            </h3>

                            <span id="col-count"></span>

                        </div>


                        <div
                            id="collections-list"
                            class="collection-list">
                        </div>


                        <div class="new-col-form">

                            <h4>
                                ${t('createCollection')}
                            </h4>


                            <input
                                type="text"
                                id="col-name"
                                maxlength="100"
                                placeholder="${t('collectionName')}"
                            >


                            <textarea
                                id="col-desc"
                                maxlength="500"
                                placeholder="${t('collectionDescription')}"
                            ></textarea>


                            <div class="form-row">

                                <label>

                                    <input
                                        type="checkbox"
                                        id="col-public"
                                        checked
                                    >

                                    ${t('publicCollection')}

                                </label>

                            </div>


                            <button
                                class="btn-create"
                                onclick="createCollection()">

                                ${t('create')}

                            </button>

                        </div>

                    </div>


                    <!-- SUBMISSIONS -->

                    <div class="section">

                        <div class="section-header">

                            <h3>
                                ${t('submissions')}
                            </h3>


                        </div>


                        <div
                            class="sub-list"
                            id="sub-list">
                        </div>

                    </div>


                    <!-- LIKED VIDEOS -->

                    <div class="section">

                        <div class="section-header">

                            <h3>
                                ${t('likedVideos')}
                            </h3>

                            <span id="liked-count"></span>

                        </div>


                        <div
                            id="liked-grid"
                            class="liked-grid">
                        </div>

                    </div>

                `;



                // =========================================================
                // PROFILE DATA
                // =========================================================

                const username = String(prof.username || '');


                // =========================================================
                // AVATAR
                // =========================================================

                const avatarElement =
                    document.getElementById('prof-avatar');

                if (avatarElement) {
                    avatarElement.textContent =
                        username
                            ? username.charAt(0).toUpperCase()
                            : '?';
                }


                // =========================================================
                // USERNAME
                // =========================================================

                const usernameElement =
                    document.getElementById('prof-username');

                if (usernameElement) {
                    usernameElement.textContent =
                        username;
                }


                // =========================================================
                // VERIFIED
                // =========================================================

                const verified =
                    prof.is_verified === true ||
                    prof.is_verified === 1 ||
                    prof.is_verified === '1' ||
                    prof.verified === true ||
                    prof.verified === 1 ||
                    prof.verified === '1' ||
                    prof.isVerified === true;


                const verifiedElement =
                    document.getElementById('prof-verified');

                if (verifiedElement) {

                    verifiedElement.style.display =
                        verified
                            ? 'inline-flex'
                            : 'none';
                }


                // =========================================================
                // USER TAGS
                // =========================================================

                const tagsElement =
                    document.getElementById('prof-tags');

                if (tagsElement) {

                    tagsElement.innerHTML = '';

                    const userTags =
                        Array.isArray(prof.tags)
                            ? prof.tags
                            : [];

                    userTags.forEach(tag => {

                        if (!tag) return;

                        const tagName =
                            String(tag.name || '').trim();

                        if (!tagName) return;


                        const tagElement =
                            document.createElement('span');

                        tagElement.className =
                            'user-tag-badge';


                        // ---------------------------------------------
                        // TAG COLOR
                        // ---------------------------------------------

                        let tagColor =
                            String(tag.color || '#7ec384');

                        if (!/^#[0-9a-fA-F]{3,8}$/.test(tagColor)) {
                            tagColor = '#7ec384';
                        }

                        tagElement.style.color =
                            tagColor;

                        tagElement.style.backgroundColor =
                            tagColor + '22';

                        tagElement.style.borderColor =
                            tagColor;


                        // ---------------------------------------------
                        // TAG ICON
                        // ---------------------------------------------

                        if (tag.icon) {

                            const iconElement =
                                document.createElement('span');

                            iconElement.textContent =
                                String(tag.icon);

                            tagElement.appendChild(
                                iconElement
                            );
                        }


                        // ---------------------------------------------
                        // TAG NAME
                        // ---------------------------------------------

                        const nameElement =
                            document.createElement('span');

                        nameElement.textContent =
                            tagName;

                        tagElement.appendChild(
                            nameElement
                        );


                        tagsElement.appendChild(
                            tagElement
                        );

                    });
                }


                // =========================================================
                // ROLE
                // =========================================================

                const roleElement =
                    document.getElementById('prof-role');

                if (roleElement) {

                    roleElement.textContent =
                        prof.role || 'user';

                }


                // =========================================================
                // COLLECTION COUNT
                // =========================================================

                const collections =
                    Array.isArray(prof.collections)
                        ? prof.collections
                        : [];

                const collectionCountElement =
                    document.getElementById('col-count');

                if (collectionCountElement) {

                    collectionCountElement.textContent =
                        `${collections.length} ${t('pieces')}`;

                }


                // =========================================================
                // LIKED COUNT
                // =========================================================

                const likedVideos =
                    Array.isArray(prof.liked_videos)
                        ? prof.liked_videos
                        : [];

                const likedCountElement =
                    document.getElementById('liked-count');

                if (likedCountElement) {

                    likedCountElement.textContent =
                        `${likedVideos.length} ${t('pieces')}`;

                }


                // =========================================================
                // RENDER
                // =========================================================

                renderCollections(collections);

                renderSubmissions(subs);

                renderLiked(likedVideos);
            } catch (error) {

                console.error('Profile loading error:', error);

                page.innerHTML = `
                    <div class="not-logged">

                        <h2>
                            ${t('error')}
                        </h2>

                        <p>
                            ${t('loginError')}
                        </p>

                    </div>
                `;
            }
        }



        async function generateTelegramCode() {

            try {

                const response = await fetch(
                    '/api/telegram/link-code',
                    {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    alert(
                        data.error ||
                        t('telegramError')
                    );

                    return;
                }


                const container =
                    document.getElementById('telegramCode');


                container.innerHTML = `

                    <p>
                        ${t('yourCode')}
                    </p>

                    <strong
                        style="font-size:32px;">
                        ${escapeHtml(data.code)}
                    </strong>

                    <p>
                        ${t('telegramBot')}
                        <b>@Mllcards_bot</b>
                    </p>

                    <code>
                        /link ${escapeHtml(data.code)}
                    </code>

                    <p>
                        ${t('codeExpires')}
                    </p>

                `;

            } catch (error) {

                console.error(
                    'Telegram code error:',
                    error
                );

                alert(t('telegramError'));
            }
        }


        /* =========================================================
           COLLECTIONS
           ========================================================= */

        function renderCollections(cols) {

            const list =
                document.getElementById(
                    'collections-list'
                );


            if (!Array.isArray(cols) || !cols.length) {

                list.innerHTML = `
                    <div class="empty-msg">
                        ${t('noCollections')}
                    </div>
                `;

                return;
            }


            list.innerHTML = '';


            cols.forEach(c => {

                const item =
                    document.createElement('div');

                item.className =
                    'collection-item';

                item.id =
                    `col-item-${c.id}`;


                /* ICON */

                const icon =
                    document.createElement('div');

                icon.className =
                    'col-icon';

                icon.textContent =
                    c.is_public ? '🌐' : '🔒';


                /* INFO */

                const info =
                    document.createElement('div');

                info.className =
                    'col-info';


                const name =
                    document.createElement('div');

                name.className =
                    'col-name';

                name.textContent =
                    c.name;


                const meta =
                    document.createElement('div');

                meta.className =
                    'col-meta';

                meta.textContent =
                    c.is_public
                        ? t('public')
                        : t('privateCollection');


                info.append(
                    name,
                    meta
                );


                /* ACTIONS */

                const actions =
                    document.createElement('div');

                actions.className =
                    'col-actions';


                /* OPEN */

                const openBtn =
                    document.createElement('a');

                openBtn.href =
                    `/collection/${c.id}`;

                openBtn.className =
                    'btn-sm btn-view';

                openBtn.textContent =
                    t('open');


                actions.appendChild(
                    openBtn
                );


                /* COPY LINK */

                if (c.is_public) {

                    const copyBtn =
                        document.createElement('button');

                    copyBtn.className =
                        'btn-sm btn-copy';

                    copyBtn.textContent =
                        t('copyLink');

                    copyBtn.onclick =
                        () => copyLink(c.id);


                    actions.appendChild(
                        copyBtn
                    );
                }


                /* DELETE */

                const delBtn =
                    document.createElement('button');

                delBtn.className =
                    'btn-sm btn-delete';

                delBtn.textContent =
                    t('delete');

                delBtn.onclick =
                    () => deleteCollection(c.id);


                actions.appendChild(
                    delBtn
                );


                item.append(
                    icon,
                    info,
                    actions
                );


                list.appendChild(
                    item
                );

            });
        }


        /* =========================================================
           SUBMISSIONS
           ========================================================= */

        function renderSubmissions(subs) {

            const list =
                document.getElementById(
                    'sub-list'
                );


            if (!Array.isArray(subs) || !subs.length) {

                list.innerHTML = `

                    <div class="empty-msg">

                        ${t('noSubmissions')}

                        <a href="/submit">

                            ${t('sendFootage')}

                        </a>

                    </div>
                `;

                return;
            }


            list.innerHTML = '';


            const labels = {

                pending:
                    t('pending'),

                approved:
                    t('approved'),

                rejected:
                    t('rejected')

            };


            const badgeClass = {

                pending:
                    'badge-pending',

                approved:
                    'badge-approved',

                rejected:
                    'badge-rejected'

            };


            const localeMap = {

                ru: 'ru-RU',

                uk: 'uk-UA',

                en: 'en-US'

            };


            const locale =
                localeMap[currentLang] ||
                'en-US';


            subs.forEach(s => {

                const item =
                    document.createElement('div');

                item.className =
                    'sub-item';


                const name =
                    document.createElement('div');

                name.className =
                    'sub-name';

                name.textContent =
                    s.display_name;


                const date =
                    document.createElement('div');

                date.className =
                    'sub-date';


                const parsedDate =
                    new Date(s.created_at);


                if (!isNaN(parsedDate.getTime())) {

                    date.textContent =
                        parsedDate.toLocaleDateString(
                            locale
                        );

                } else {

                    date.textContent =
                        s.created_at || '';

                }


                const badge =
                    document.createElement('div');

                badge.className =
                    `badge ${badgeClass[s.status] || ''}`;

                badge.textContent =
                    labels[s.status] ||
                    s.status ||
                    '';


                item.append(
                    name,
                    date,
                    badge
                );


                list.appendChild(
                    item
                );

            });
        }


        /* =========================================================
           LIKED VIDEOS
           ========================================================= */

        function renderLiked(videos) {

            const grid =
                document.getElementById(
                    'liked-grid'
                );


            if (!Array.isArray(videos) || !videos.length) {

                grid.innerHTML = `

                    <div class="empty-msg">

                        ${t('noLikedVideos')}

                    </div>

                `;

                return;
            }


            grid.innerHTML = '';


            videos.forEach(name => {

                const isImg =
                    /\.(jpg|jpeg|png|gif|webp)$/i
                        .test(name);


                const card =
                    document.createElement('div');

                card.className =
                    'liked-card';


                const thumb =
                    document.createElement('div');

                thumb.className =
                    'liked-thumb';


                const media =
                    document.createElement(
                        isImg
                            ? 'img'
                            : 'video'
                    );


                media.src =
                    `/videos/${encodeURIComponent(name)}`;


                if (!isImg) {

                    media.preload =
                        'metadata';

                } else {

                    media.alt =
                        name;

                    media.loading =
                        'lazy';
                }


                thumb.appendChild(
                    media
                );


                const info =
                    document.createElement('div');

                info.className =
                    'liked-info';


                const nameEl =
                    document.createElement('div');

                nameEl.textContent =
                    name;


                const dlLink =
                    document.createElement('a');

                dlLink.href =
                    `/videos/${encodeURIComponent(name)}`;

                dlLink.download =
                    name;

                dlLink.textContent =
                    t('download');


                info.append(
                    nameEl,
                    dlLink
                );


                card.append(
                    thumb,
                    info
                );


                grid.appendChild(
                    card
                );

            });
        }


        /* =========================================================
           CREATE COLLECTION
           ========================================================= */

        async function createCollection() {

            const nameInput =
                document.getElementById(
                    'col-name'
                );

            const descInput =
                document.getElementById(
                    'col-desc'
                );

            const publicInput =
                document.getElementById(
                    'col-public'
                );


            const name =
                nameInput.value.trim();

            const desc =
                descInput.value.trim();

            const isPublic =
                publicInput.checked
                    ? 1
                    : 0;


            if (!name) {

                showToast(
                    t('collectionNameRequired'),
                    '#e53935'
                );

                return;
            }


            try {

                const res =
                    await fetch(
                        '/api/collections',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            credentials:
                                'same-origin',

                            body: JSON.stringify({
                                name,
                                description: desc,
                                is_public: isPublic
                            })
                        }
                    );


                const data =
                    await res.json();


                if (data.success) {

                    showToast(
                        t('collectionCreated')
                    );


                    nameInput.value = '';

                    descInput.value = '';


                    await loadProfile();

                } else {

                    showToast(
                        data.error ||
                        t('error'),
                        '#e53935'
                    );

                }

            } catch (error) {

                console.error(
                    'Create collection error:',
                    error
                );

                showToast(
                    t('error'),
                    '#e53935'
                );
            }
        }


        /* =========================================================
           DELETE COLLECTION
           ========================================================= */

        async function deleteCollection(id) {

            if (
                !confirm(
                    t('deleteCollectionConfirm')
                )
            ) {
                return;
            }


            try {

                const res =
                    await fetch(
                        `/api/collections/${id}`,
                        {
                            method: 'DELETE',
                            credentials: 'same-origin'
                        }
                    );


                const data =
                    await res.json();


                if (data.success) {

                    showToast(
                        t('collectionDeleted'),
                        '#e53935'
                    );


                    document
                        .getElementById(
                            `col-item-${id}`
                        )
                        ?.remove();


                } else {

                    showToast(
                        data.error ||
                        t('error'),
                        '#e53935'
                    );

                }

            } catch (error) {

                console.error(
                    'Delete collection error:',
                    error
                );

                showToast(
                    t('error'),
                    '#e53935'
                );
            }
        }


        /* =========================================================
           COPY COLLECTION LINK
           ========================================================= */

        function copyLink(id) {

            const url =
                `${location.origin}/collection/${id}`;


            navigator.clipboard
                .writeText(url)
                .then(() => {

                    showToast(
                        t('linkCopied')
                    );

                })
                .catch(error => {

                    console.error(
                        'Copy error:',
                        error
                    );

                    showToast(
                        url,
                        '#555'
                    );

                });
        }


        /* =========================================================
           LOGOUT
           ========================================================= */

        async function logout() {

            try {

                await fetch(
                    '/api/logout',
                    {
                        method: 'POST',
                        credentials: 'same-origin'
                    }
                );

            } catch (error) {

                console.error(
                    'Logout error:',
                    error
                );

            }


            location.href = '/';
        }


        /* =========================================================
           APPLY STATIC LANGUAGE
           ========================================================= */

        function applyLanguage() {

            const backLink =
                document.getElementById(
                    'backLink'
                );

            if (backLink) {
                backLink.textContent =
                    t('back');
            }


            const loadingText =
                document.getElementById(
                    'loadingText'
                );

            if (loadingText) {
                loadingText.textContent =
                    t('loading');
            }


            document.documentElement.lang =
                currentLang;
        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                /*
                 * ВАЖНО:
                 * Берём язык именно из общего app_lang.
                 */

                currentLang =
                    localStorage.getItem(
                        'app_lang'
                    ) || 'en';


                if (!translations[currentLang]) {
                    currentLang = 'en';
                }


                applyLanguage();


                loadProfile();

            }
        );

    </script>
